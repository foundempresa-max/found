name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Solo se publica la web. Los SQL de Supabase, el README y la configuración
      # de GitHub se quedan en el repositorio y no salen en la dirección pública.
      - name: Preparar solo los archivos públicos
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='supabase' \
            --exclude='README.md' --exclude='_site' --exclude='*.sql' --exclude='*.ts' \
            --exclude='.env*' --exclude='*.zip' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
